# LAGDA quality gates (Gap Closure Command 6).
#
# Two jobs, deliberately: `quality` is fast and gates every push; `browser` costs
# a build plus a browser download and runs after it. Splitting further would
# duplicate `npm ci` for no benefit.
#
# This workflow NEVER deploys, sends email or SMS, requests browser push,
# executes Automation, or touches a production credential. It needs no secrets —
# LAGDA is a frontend-only demonstration and every service is an in-memory mock.

name: Quality

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: read the repository, nothing else. No packages, no deployments,
# no id-token, no write access of any kind.
permissions:
  contents: read

# A newer push supersedes an in-flight run on the same ref.
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keeps CI output deterministic and matches the local test environment.
  TZ: Asia/Manila
  # Never let a stray script prompt for input.
  CI: "true"

jobs:
  quality:
    name: Type-check, lint, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Matches the Node the repository is developed against.
          node-version: 22
          cache: npm

      # `npm ci` — installs strictly from package-lock.json and fails if the
      # lockfile and package.json have drifted. Never `npm install` in CI.
      - name: Install dependencies
        run: npm ci

      # This repo also keeps pnpm-lock.yaml (local dev). Nothing else keeps
      # the two lockfiles in sync — `npm ci` above only checks package-lock's
      # own specifiers, not pnpm's. Catches drift here instead of it later
      # surfacing as an unrelated-looking Netlify deploy failure (#11).
      - name: Check lockfile parity (npm vs pnpm)
        run: node scripts/check-lockfile-parity.mjs

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and component tests with coverage
        run: npm run test:coverage

      - name: Production build (launch-default)
        run: npm run build
        env:
          VITE_LAUNCH_PROFILE: launch-default

      # The enterprise-preview profile ships different code. Building both is the
      # only way to know a change has not broken the gated build.
      - name: Production build (enterprise-preview)
        run: npm run build
        env:
          VITE_LAUNCH_PROFILE: enterprise-preview

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload unit test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  browser:
    name: Browser flows and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Chromium AND WebKit.
      #
      # The previous comment here claimed "the critical-flow suite, the
      # accessibility project and the responsive projects all run on Chromium".
      # That was wrong, and it hid a whole suite:
      #
      #   devices["iPhone 13"].defaultBrowserType    === "webkit"   (mobile-390)
      #   devices["iPad (gen 7)"].defaultBrowserType === "webkit"   (tablet-portrait)
      #
      # Two of the four responsive projects are WebKit. Installing Chromium
      # alone meant every test in them failed in 6-9ms with a missing browser.
      # Firefox is still not installed — no project uses it.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      # Every suite runs and reports, even when an earlier one fails.
      #
      # Without `if: ${{ !cancelled() }}` these four steps short-circuit: the
      # first failure skips the rest, so a red critical-flow suite silently
      # hid the accessibility, responsive and reduced-motion results. They had
      # never once executed on `main`. A failing step still fails the job — the
      # point is to see ALL of the damage in one run, not to tolerate any of it.
      - name: Critical browser flows
        if: ${{ !cancelled() }}
        run: npm run test:e2e

      - name: Accessibility (axe)
        if: ${{ !cancelled() }}
        run: npm run test:a11y

      - name: Responsive viewports
        if: ${{ !cancelled() }}
        run: npm run test:responsive

      - name: Reduced motion
        if: ${{ !cancelled() }}
        run: npm run test:reduced-motion

      # Failure artifacts. Traces and screenshots render FICTIONAL fixture data
      # only — there is no real recipient, document, credential, or token in this
      # application to capture. Retention is short regardless.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload failure traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
