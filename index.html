      <!-- Default to noindex until SSR/prerendering is available for SPA routes. -->
      <meta name="robots" content="noindex, nofollow" />

      <meta property="og:locale" content="en_PH" />

      <!-- Favicon — dedicated 96x96 build (4 KB). Do not point this at the full

      <link rel="icon" type="image/png" sizes="96x96" href="/brand/favicon-96.png" />
      <link rel="apple-touch-icon" href="/brand/LagdaLogoIconFullColorSquare.png" />

      <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>

    </head>
